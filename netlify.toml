[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Configuração de timeout para funções (em segundos)
# O Netlify tem limite máximo de 26 segundos para funções no plano gratuito
# Para planos pagos, pode ser configurado até 60 segundos
[functions]
  node_bundler = "esbuild"
  # Timeout de 26 segundos (máximo para plano gratuito)
  timeout = 26

# O Netlify detecta automaticamente Next.js e usa o plugin apropriado

